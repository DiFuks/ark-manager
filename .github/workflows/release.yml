name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
            artifact_glob: dist/ArkManager-*-macos-arm64.zip
          - os: ubuntu-latest
            target: linux
            artifact_glob: dist/ArkManager-*-linux-x64.tar.gz
          - os: windows-latest
            target: windows
            artifact_glob: dist/ArkManager-*-windows-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Cache wine tarballs
        if: matrix.target != 'windows'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ark-manager/wine
          key: wine-${{ matrix.target }}-${{ hashFiles('build/wine-sources.json') }}

      # build.sh is bash; on Windows the runner has Git Bash on PATH as `bash.exe`.
      - name: Build
        shell: bash
        run: ./build.sh --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
          generate_release_notes: true
